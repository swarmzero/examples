[model]
max_iterations = 10
# for Azure Open AI use azure/<azure-deployment-name>
model = "gpt-4o"
enable_multi_modal = false
ollama_server_url = "http://localhost:11434"

[sample_prompts]
prompts = [
  "What can you help me do?",
  "Which tools do you have access to?",
  "What are your capabilities?"
]

[environment]
type = "dev"

[timeout]
llm = 30

[default_config]
log = "WARNING"
